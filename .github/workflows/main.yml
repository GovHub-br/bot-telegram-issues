name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testes (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [".", "hayhooks"]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q

  images:
    name: Imagem ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: bot
            context: .
            image: ghcr.io/govhub-br/bot-telegram-issues
          - name: hayhooks
            context: hayhooks
            image: ghcr.io/govhub-br/bot-telegram-issues-hayhooks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Só publica no push para a main; em PR apenas builda.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
