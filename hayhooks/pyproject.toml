[project]
name = "issue-drafter"
version = "0.1.0"
description = "Endpoint Hayhooks que transforma relatos em rascunhos de issue (Agent do Haystack + Ollama)"
requires-python = ">=3.11"
dependencies = [
    "haystack-ai==3.0.0",
    "hayhooks==1.22.0",
    "ollama-haystack==6.8.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_drafter"]

[tool.hatch.build.targets.wheel.force-include]
"src/issue_drafter/prompts" = "issue_drafter/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
