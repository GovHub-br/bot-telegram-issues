[project]
name = "bot-telegram-issues"
version = "0.1.0"
description = "Bot do Telegram para criar e consultar issues de um repositório no GitHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
issues-bot = "issues_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issues_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
