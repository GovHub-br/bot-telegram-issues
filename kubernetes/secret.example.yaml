# Exemplo do Secret. NÃO coloque tokens de verdade neste arquivo nem no git:
# crie o Secret a partir do .env com o comando do kubernetes/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: bot-telegram-issues-tokens
  namespace: bot-telegram-issues
type: Opaque
stringData:
  TELEGRAM_TOKEN: "123456789:AAH..."
  GITHUB_TOKEN: "github_pat_..."
  # Token só com Contents: write no repositório de anexos (ASSETS_REPO).
  GITHUB_TOKEN_ASSETS: "github_pat_..."
