# Configuração sem segredos, lida pelo bot e pelo Hayhooks.
# Os tokens (TELEGRAM_TOKEN e GITHUB_TOKEN) ficam no Secret "bot-telegram-issues-tokens".
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-telegram-issues-config
data:
  GITHUB_ORG: GovHub-br
  # Vazio = todos os repositórios da organização com issues ativadas.
  GITHUB_REPOS: ""
  GITHUB_PROJECT: GovHub-br/4
  PROJECT_STATUS: Project Backlog
  DEFAULT_LABELS: arquitetura
  # Templates de issue usados quando o repositório escolhido não tem os seus.
  ISSUE_TEMPLATES_REPO: data-application-cidades
  # Repositório (privado) onde ficam as imagens anexadas às issues.
  ASSETS_REPO: issue-assets
  # Quem usa o bot: IDs ou usernames do Telegram. Para liberar um grupo inteiro,
  # coloque o ID dele em ALLOWED_CHATS (o /start no grupo mostra o ID).
  ALLOWED_USERS: arthrok
  ALLOWED_CHATS: ""
  HAYHOOKS_URL: http://hayhooks:1416
  # Service do cluster que aponta para o Mac Studio (10.0.0.10).
  OLLAMA_URL: http://ollama-external.macstudio.svc.cluster.local:11434
  OLLAMA_MODEL: qwen3.8:27b-mlx
  LOG_LEVEL: INFO
